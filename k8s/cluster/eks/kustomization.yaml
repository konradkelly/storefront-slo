# EKS's own manifests (Phase 4b). Argo CD syncs this as cluster-config (k8s/platform/templates/cluster-config.yaml):
# k3s's set with a Network Load Balancer Gateway instead of ServiceLB, and the default StorageClass EKS doesn't
# create. The node alerts stay: the nodes are still EC2 instances in a managed node group, and a full disk or memory
# exhaustion is still ours to notice. No dashboard snapshots yet (kps-values-eks.yaml). The monitoring routes'
# hostnames, and the NLB's Elastic IPs and allowed addresses, come from the cluster-config Application.
#   kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/cluster/eks
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../gateway/gateway-eks.yaml
  - ../../gateway/monitoring-routes.yaml
  - ../../monitoring/storefront-probe.yaml
  - ../../monitoring/node-alerts.yaml
  - storageclass.yaml

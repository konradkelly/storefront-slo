# The default StorageClass on EKS, which creates none of its own. Postgres's volumes (k8s/base/postgres.yaml asks for
# the default) become EBS gp3 volumes through the EBS CSI driver (terraform/aws/eks/eks.tf), instead of k3s's
# local-path directories on a node's disk.
#   WaitForFirstConsumer: the volume is made in the zone the pod is scheduled to. An EBS volume can only attach to a
#   node in its own zone, so a volume made first could strand its pod.
#   Delete: removing the claim deletes the volume. Postgres's data is in its S3 archive; the volume is a copy.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true

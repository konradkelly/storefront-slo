# kind's own manifests. Argo CD syncs this as cluster-config (k8s/platform/templates/cluster-config.yaml), once the
# charts that define their CRDs are up: the Gateway with kind's hostPort, the monitoring UI routes and the synthetic
# probe.
#   kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/cluster/kind
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../gateway/gateway.yaml
  - ../../gateway/monitoring-routes.yaml
  - ../../monitoring/storefront-probe.yaml

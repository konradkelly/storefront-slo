# The same two Secrets k3s-up.sh and kind-up.sh create, with the same keys (k8s/monitoring/kps-values.yaml mounts
# alertmanager-slack; k8s/platform/files/kps-remote-write.yaml reads grafana-cloud). External Secrets owns them and
# rereads Parameter Store hourly, so a changed webhook arrives without a redeploy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: parameter-store
  target:
    name: alertmanager-slack
  data:
    - secretKey: slack-page-url
      remoteRef:
        key: /storefront/slack/page-url
    - secretKey: slack-ticket-url
      remoteRef:
        key: /storefront/slack/ticket-url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cloud
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: parameter-store
  target:
    name: grafana-cloud
  data:
    - secretKey: username
      remoteRef:
        key: /storefront/grafana-cloud/user
    - secretKey: password
      remoteRef:
        key: /storefront/grafana-cloud/token

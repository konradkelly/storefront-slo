# The monitoring UIs through the Gateway instead of port-forwards. *.localhost resolves to 127.0.0.1 in browsers and
# curl, so no hosts-file entries are needed on kind. On k3s, scripts/k3s-up.sh rewrites the hostnames to
# <name>.<server IP>.sslip.io. These UIs have no login in front of them (Grafana has admin/admin): fine on a laptop,
# and on k3s only because the security group admits nothing but your own IP. Never on a shared cluster.
# Each rule spells out matches, though PathPrefix / is the default: the API server fills in a missing one, and Argo CD
# then shows the route as OutOfSync forever (seen on the first app-of-apps sync, 2026-10-31).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs: [{ name: storefront, namespace: gateway }]
  hostnames: [grafana.localhost]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: kps-grafana, port: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  parentRefs: [{ name: storefront, namespace: gateway }]
  hostnames: [prometheus.localhost]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: kps-kube-prometheus-stack-prometheus, port: 9090 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  parentRefs: [{ name: storefront, namespace: gateway }]
  hostnames: [alertmanager.localhost]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: kps-kube-prometheus-stack-alertmanager, port: 9093 }]

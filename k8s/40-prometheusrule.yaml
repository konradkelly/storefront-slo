apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: storefront-api-alerts
  namespace: storefront
  labels:
    release: kps
spec:
  groups:
    - name: storefront-api
      rules:
        - alert: StorefrontCheckoutFailureRateHigh
          expr: |
            sum(rate(storefront_checkouts_total{status!="success"}[5m]))
              /
            sum(rate(storefront_checkouts_total[5m]))
              > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "More than 5% of checkouts are failing"
            description: "Checkout failure ratio is {{ $value | humanizePercentage }} over the last 5 minutes."
        - alert: StorefrontCheckoutLatencyHigh
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_server_requests_seconds_bucket{uri="/orders", method="POST"}[5m]))
            ) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Checkout p95 latency is above 1 second"
            description: "p95 checkout latency is {{ $value | humanizeDuration }}."

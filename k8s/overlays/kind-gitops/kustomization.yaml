# Registry-backed kind environment. Keep overlays/kind for local dev image loads.
# Release replaces the SHA tag with the signed image digest after a successful CI.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../kind
images:
  - name: storefront-api
    newName: ghcr.io/konradkelly/storefront-slo
    digest: sha256:6b66700fac0ad14489c0c949e8eba25eb7193e9f4a8f34913571c6968a01da9a

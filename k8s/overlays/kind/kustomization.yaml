# kind: the image is built locally and loaded into the nodes (`kind load docker-image`), so it's never pulled.
#   kubectl --context kind-storefront apply -k k8s/overlays/kind
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: storefront-api
    newName: storefront-api
    newTag: dev

patches:
  # The public hostname for the app route (base/httproute.yaml). *.localhost resolves to 127.0.0.1.
  - target:
      kind: HTTPRoute
      name: storefront-api
    patch: |-
      - op: add
        path: /spec/hostnames
        value: [storefront.localhost]
  # Scale on request rate only, without the CPU backstop (base/autoscaling.yaml). kind's nodes share the laptop's cores,
  # so a pod's CPU mostly measures its neighbours and its own JVM warm-up. On a rebuild (2026-10-31) the API pods
  # crash-looped until the database was up, each restart a cold JVM, and the CPU trigger took the Deployment to its
  # maximum of 6 while the laptop was already at 100%, which slowed the rebuild further.
  - target:
      kind: ScaledObject
      name: storefront-api
    patch: |-
      - op: test
        path: /spec/triggers/1/type
        value: cpu
      - op: remove
        path: /spec/triggers/1
  # Lab only, like etcd's --unsafe-no-fsync in k8s/kind-config.yaml. Docker Desktop's WSL virtual disk occasionally
  # stalls a WAL flush for seconds, and every transaction waits behind it (and behind the row locks held while it
  # waits). Measured 2026-10-05 with checkout-stress at 10 VUs: with the default, checkout p95 was 2.06s, p99 5.3s,
  # and 11.5% of checkouts took over 500ms; with synchronous_commit off, p95 was 239ms, p99 260ms, 0.7% over 500ms,
  # at the same throughput and CPU. Off means a commit returns before its WAL reaches disk, so a crash of the Docker
  # VM can lose the last fraction of a second of commits (no corruption). Never set this in base/ or a cloud overlay.
  - target:
      kind: Cluster
      name: storefront-db
    patch: |-
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: storefront-db
      spec:
        postgresql:
          parameters:
            synchronous_commit: "off"

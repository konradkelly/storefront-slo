# kind: the image is built locally and loaded into the nodes (`kind load docker-image`), so it's never pulled.
#   kubectl --context kind-storefront apply -k k8s/overlays/kind
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: storefront-api
    newName: storefront-api
    newTag: dev

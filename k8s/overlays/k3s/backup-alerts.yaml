# WAL that stops reaching S3 is silent: CloudNativePG keeps reporting the cluster healthy, and base backups still
# finish as DONE. On 2026-11-12 the old database's archiver stalled for 3.5 hours before the nightly destroy. The 03:00
# backup was marked DONE without its last WAL segment, and the next make up couldn't restore it (docs/k3s.md,
# "Keeping the data"). Archived and failed counts both stayed flat, so a failure-count alert would have missed it.
# A segment waiting in archive_status/*.ready catches a failing archiver and a hung one alike. Postgres closes
# segments at least every 5 minutes (archive_timeout) and archiving takes seconds, so 15 minutes is a real backlog.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: storefront-backups
  namespace: storefront
  labels:
    release: kps
spec:
  groups:
    - name: storefront-backups
      rules:
        - alert: PostgresWalArchivingStuck
          expr: cnpg_collector_pg_wal_archive_status{value="ready"} > 0
          for: 15m
          labels:
            severity: ticket
          annotations:
            summary: "{{ $labels.pod }} has WAL that hasn't reached S3 for 15 minutes"
            description: "{{ $value }} WAL segment(s) waiting to be archived. Until they are, a restore loses everything after the last archived one, and a base backup taken meanwhile can't be restored."
            runbook_url: "https://github.com/konradkelly/storefront-slo/blob/main/docs/runbooks/PostgresWalArchivingStuck.md"

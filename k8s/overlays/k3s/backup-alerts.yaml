# WAL that stops reaching S3 is silent: CloudNativePG keeps reporting the cluster healthy, and base backups still
# finish as DONE, though a restore needs their WAL. A closed segment waiting in archive_status/*.ready catches a
# failing archiver (credentials, bucket) and a hung one alike; counting failures misses a hang. Archiving a segment
# takes seconds, so 15 minutes is a real backlog.
#
# It wouldn't have caught 2026-11-12. Nothing was waiting then: the backup's last segment was still open on an
# idle primary (backups.yaml, target).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: storefront-backups
  namespace: storefront
  labels:
    release: kps
spec:
  groups:
    - name: storefront-backups
      rules:
        - alert: PostgresWalArchivingStuck
          expr: cnpg_collector_pg_wal_archive_status{value="ready"} > 0
          for: 15m
          labels:
            severity: ticket
          annotations:
            summary: "{{ $labels.pod }} has WAL that hasn't reached S3 for 15 minutes"
            description: "{{ $value }} WAL segment(s) waiting to be archived. Until they are, a restore loses everything after the last archived one, and a base backup taken meanwhile can't be restored."
            runbook_url: "https://github.com/konradkelly/storefront-slo/blob/main/docs/runbooks/PostgresWalArchivingStuck.md"

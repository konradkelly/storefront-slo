# k3s on EC2 (Phase 4a, terraform/aws/k3s). Argo CD syncs this overlay (k8s/platform/values-k3s.yaml).
# Differences from kind, each one a thing a managed cluster would handle differently (see docs/k3s.md):
#   - the image comes from GHCR; the release workflow writes the signed digest here
#   - Postgres archives WAL and takes daily base backups to S3 (backups.yaml), because local-path volumes die with
#     their node
#   - no synchronous_commit override: that was a workaround for Docker Desktop's disk (overlays/kind)
#   - the app route has no hostname, so http://<server IP>/products matches. The monitoring UIs have hostnames
#     (k8s/platform/templates/cluster-config.yaml), and a route with a hostname wins over this one for its host.
#
# Postgres reaching S3 needs no NetworkPolicy change: base/networkpolicy.yaml already lets the database pods
# reach any address on 443 (for the Kubernetes API), and S3 is HTTPS.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - backups.yaml
  - backup-alerts.yaml
  - eks-archive.yaml

patches:
  # Ship WAL through the Barman Cloud plugin (installed by Argo CD, k8s/platform/values-k3s.yaml) to the ObjectStore in backups.yaml.
  #
  # And take part in a CloudNativePG distributed topology with the EKS database (Phase 4b, docs/eks.md): one
  # database in two clusters, each replaying the other's archive while it isn't the primary. "k3s" and "eks" name
  # the two; both Clusters are called storefront-db, so `self` says which one this is. k3s is the primary unless
  # scripts/db-switchover.sh has moved it: that script overrides `primary` (and passes the promotion token) on the
  # storefront Argo CD Application, not in git, because the switchover's two steps have to reach the two clusters
  # in order.
  - target:
      kind: Cluster
      name: storefront-db
    patch: |-
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: storefront-db
      spec:
        plugins:
          - name: barman-cloud.cloudnative-pg.io
            isWALArchiver: true
            parameters:
              barmanObjectName: storefront-backups
        # The app user's password from Parameter Store, the same one EKS's database gets (k8s/overlays/eks/
        # db-app-secret.yaml), so either database accepts the app after a switchover. scripts/k3s-up.sh creates
        # the Secret before the database exists.
        bootstrap:
          initdb:
            secret:
              name: storefront-db-app
        replica:
          self: k3s
          primary: k3s
          source: eks
        # Both archives keep each database under the folder named after its Cluster, storefront-db.
        externalClusters:
          - name: k3s
            plugin:
              name: barman-cloud.cloudnative-pg.io
              parameters:
                barmanObjectName: storefront-backups
                serverName: storefront-db
          - name: eks
            plugin:
              name: barman-cloud.cloudnative-pg.io
              parameters:
                barmanObjectName: eks-archive
                serverName: storefront-db
  # PAYMENT_FAILURE_RATE, the knob scripts/experiments/k3s-fault.sh turns.
  - path: payment-fault.yaml

# Keep images last: scripts/promote-image.sh rewrites everything after this line.
images:
  - name: storefront-api
    newName: ghcr.io/konradkelly/storefront-slo
    digest: sha256:a06f0ceb9d12fc784fb965aac4cca24b27be9e924f9ae1f5860858db08c4a89f

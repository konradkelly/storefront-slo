# The database app user's credentials, from Parameter Store (scripts/secrets-push.sh): the same password k3s-up.sh
# gives the k3s database, so the replicated role and this Secret agree, and CloudNativePG sets it again at promotion.
# Wave -1: the Cluster (wave 0) is restored with this Secret named in its bootstrap, so it has to exist first.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storefront-db-app
  namespace: storefront
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: parameter-store
  target:
    name: storefront-db-app
    template:
      type: kubernetes.io/basic-auth
      data:
        username: storefront
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: /storefront/db/app-password

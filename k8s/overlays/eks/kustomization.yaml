# EKS (Phase 4b, terraform/aws/eks). Argo CD syncs this overlay (k8s/platform/values-eks.yaml).
#
# Built on the k3s overlay, so this file is exactly what EKS changes. It inherits the GHCR image the release workflow
# writes there, the S3 backups and their alert, and the payment fault knob. What differs:
#   - backups use the Pod Identity role terraform/aws/eks/platform.tf gives the Postgres pods' service account, not a
#     static access key in a Secret, so there's no storefront-backup-s3 Secret here;
#   - they go to eks/ in the same bucket, where that role may write, so the EKS database never touches the k3s
#     archive (storefront-db/);
#   - the database is the k3s database's replica (slice 3, docs/eks.md): restored from the k3s archive, then
#     replaying it, until scripts/db-switchover.sh makes EKS the primary;
#   - the Postgres pods may reach the Pod Identity agent (pod-identity-netpol.yaml).
# Volumes come from the cluster's default StorageClass, gp3 on EBS (k8s/cluster/eks/storageclass.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../k3s
  - k3s-archive.yaml
  - db-app-secret.yaml
  - pod-identity-netpol.yaml

patches:
  - target:
      kind: ObjectStore
      name: storefront-backups
    patch: |-
      - op: replace
        path: /spec/configuration/destinationPath
        value: s3://storefront-k3s-backups-675901257165/eks
      # No region: it can only come from a Secret alongside inheritFromIAMRole, and the bucket is in us-east-1,
      # where S3 clients default to.
      - op: replace
        path: /spec/configuration/s3Credentials
        value:
          inheritFromIAMRole: true
  # The k3s overlay's reader for this archive: here it's storefront-backups itself.
  - patch: |-
      $patch: delete
      apiVersion: barmancloud.cnpg.io/v1
      kind: ObjectStore
      metadata:
        name: eks-archive
        namespace: storefront
  - target:
      kind: Cluster
      name: storefront-db
    patch: |-
      # Restored from the k3s archive's newest base backup, then a replica of it: the same database, with the same
      # system identifier, which a switchover needs.
      - op: replace
        path: /spec/bootstrap
        value:
          recovery:
            source: k3s
            database: storefront
            owner: storefront
            # The roles are k3s's, replicated, so the app must log in with k3s's password: both clusters' Secret comes
            # from the same parameter (db-app-secret.yaml here, k3s-up.sh on k3s). At promotion CloudNativePG sets the
            # app user's password from this Secret.
            secret:
              name: storefront-db-app
      - op: replace
        path: /spec/replica
        value:
          self: eks
          primary: k3s
          source: k3s
      - op: replace
        path: /spec/externalClusters
        value:
          - name: k3s
            plugin:
              name: barman-cloud.cloudnative-pg.io
              parameters:
                barmanObjectName: k3s-archive
                serverName: storefront-db
          - name: eks
            plugin:
              name: barman-cloud.cloudnative-pg.io
              parameters:
                barmanObjectName: storefront-backups
                serverName: storefront-db

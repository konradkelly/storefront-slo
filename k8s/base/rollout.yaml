# Releases of storefront-api go out as a canary (Argo Rollouts, installed by Argo CD from k8s/platform). The new
# version first gets 20% of the Gateway's traffic, then 50%, then all of it, five minutes per step. All the while an
# analysis compares the new version's error ratios with the old version's over the same minutes. If the new version
# burns the SLO budget much faster, the Rollout aborts: traffic goes back to the old version and the new pods are
# removed, without anyone running kubectl. The fix is then a revert in git, like any other bad commit.
#
# The pod template stays in the Deployment (storefront-api.yaml). This Rollout points at it (workloadRef) and leaves
# it at the 0 replicas git sets, so overlays, the soak drill and the fault experiments still patch a Deployment, and
# every change to its template becomes a canary. The CI overlay has no Argo Rollouts and runs the Deployment as it is.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: storefront-api
  namespace: storefront
spec:
  # The starting count (minimum one per zone). KEDA owns it after that (autoscaling.yaml), and Argo CD ignores it
  # (k8s/platform/templates/storefront.yaml). Without it the Rollout would start at 1 replica.
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: storefront-api
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: storefront-api
    # never: the Rollout doesn't scale the Deployment at all. progressively was for handing over from a Deployment
    # that already ran pods, and none does now. It also scales the Deployment back up whenever the Rollout's first
    # revision is unhealthy, to the Rollout's count minus its ready pods. On 2026-11-06 that started more JVMs on a
    # node that was already out of memory (docs/postmortems/2026-11-06-k3s-server-memory-thrash.md).
    scaleDown: never
  strategy:
    canary:
      # Rollouts adds the pod-template hash of each version to these Services' selectors, and the Gateway API plugin
      # sets the HTTPRoute's weights between them (httproute.yaml). Traffic that doesn't come through the Gateway
      # (in-cluster callers of the storefront-api Service) only ever reaches the stable version.
      stableService: storefront-api
      canaryService: storefront-api-canary
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: storefront-api
            namespace: storefront
      analysis:
        # From the 20% step on: by then the canary pod is ready, so it's being scraped (see the template below).
        startingStep: 1
        templates:
          - templateName: storefront-canary
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      steps:
        - setWeight: 20
        - pause: { duration: 5m }
        - setWeight: 50
        - pause: { duration: 5m }
---
# Runs for the rest of the canary, once a minute. Each check reads the canary recording rules
# (prometheus/rules/canary.yml): each version's own requests, told apart by their rollouts_pod_template_hash label
# (podmonitor.yaml), and each version against the rest of the traffic, which during a canary is the stable version.
#
# What it judges: errors the code returns itself (5xx). Payment declines (402) aren't counted, unlike in the checkout
# SLO: they come from the payment provider and hit both versions alike, so they say nothing about the release. That's
# also what lets the soak drill and k3s-fault.sh raise PAYMENT_FAILURE_RATE through a canary.
#
# Two checks per SLI, both against a burn rate of 6, the rate at which the slow-burn alerts page
# (prometheus/rules/slo-alerts.yml). For checkout that's 3% errors.
#   - *-vs-stable: how much faster the canary burns than stable over the same 5 minutes. Over 6 aborts: the canary is
#     worse than the version it replaces, so the release is to blame. The difference counts only when it's beyond
#     chance (a two-proportion z-test, z > 3). Without that, an outage on both versions would abort good releases:
#     while the 5-minute windows fill with errors, a canary with ~90 checkouts lands ~6 points from stable by chance
#     alone, and 3 points (a burn rate of 6) was enough. A real bad release clears it easily: BUG_MODE (10% errors)
#     scores z ~6 by its first 50 checkouts. A single failed check aborts: the 5-minute window already smooths out
#     single requests.
#   - *-burn-rate: the canary's own burn rate. Over 6 while stable is just as bad (a database outage, an overloaded
#     cluster) is neither a pass nor a fail. The check is inconclusive, so the Rollout pauses: it doesn't blame a good
#     release for an outage, and doesn't promote it into one either. Someone then runs `kubectl argo rollouts
#     promote` or `abort` (docs/delivery.md). Until 2026-11-07 this check decided alone, and would have failed a good
#     release during a database outage.
#
# Each query returns one of three things:
#   - the burn rate (or how much faster than stable), once the canary has served 50 requests of that kind. The
#     comparison also needs 50 from stable. Until then it gives 0, and the canary's own burn rate pauses a bad canary
#     instead of aborting it: a handful of stable requests is no baseline.
#   - 0 (pass) before that, as long as Prometheus is scraping a canary pod (up == 1). With few requests, one failure is
#     already a high ratio (1 in 20 is 5%), and on an idle cluster every release would stall. The cost: a release that
#     arrives while nobody is shopping is promoted unjudged, and only the SLO alerts catch it later.
#   - nothing, when Prometheus can't see the canary at all. result[0] is then an error, and 4 errors in a row abort the
#     release: if it can't be checked, it doesn't go out. The first version passed on nothing, and on 2026-10-31 it
#     promoted the BUG_MODE release while an overloaded kind cluster had stopped scraping (docs/delivery.md).
#
# The same queries, with fixed hashes, are unit-tested in prometheus/tests/canary_test.yml.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: storefront-canary
  namespace: storefront
spec:
  args:
    - name: canary-hash
  metrics:
    - name: checkout-vs-stable
      interval: 1m
      failureLimit: 0
      consecutiveErrorLimit: 4
      successCondition: result[0] <= 6
      failureCondition: result[0] > 6
      provider:
        prometheus:
          address: http://prometheus-operated.monitoring.svc:9090
          query: |
            (
              slo_canary:checkout_vs_rest:burn_difference{rollouts_pod_template_hash="{{args.canary-hash}}"}
              and on(rollouts_pod_template_hash)
              slo_canary:checkout_vs_rest:zscore{rollouts_pod_template_hash="{{args.canary-hash}}"} > 3
              and on(rollouts_pod_template_hash)
              slo_canary:checkout_requests:increase5m{rollouts_pod_template_hash="{{args.canary-hash}}"} >= 50
            )
            or on(rollouts_pod_template_hash)
            max by (rollouts_pod_template_hash) (up{job="storefront-api", rollouts_pod_template_hash="{{args.canary-hash}}"} == 1) * 0
    - name: checkout-burn-rate
      interval: 1m
      consecutiveErrorLimit: 4
      successCondition: result[0] <= 6
      failureCondition: result[0] < 0 # never: a burn rate isn't negative. Over 6 is inconclusive, see above
      provider:
        prometheus:
          address: http://prometheus-operated.monitoring.svc:9090
          query: |
            (
              slo_canary:checkout_errors:ratio_rate5m{rollouts_pod_template_hash="{{args.canary-hash}}"}
                / scalar(1 - slo:checkout_availability:objective)
              and on(rollouts_pod_template_hash)
              slo_canary:checkout_requests:increase5m{rollouts_pod_template_hash="{{args.canary-hash}}"} >= 50
            )
            or on(rollouts_pod_template_hash)
            max by (rollouts_pod_template_hash) (up{job="storefront-api", rollouts_pod_template_hash="{{args.canary-hash}}"} == 1) * 0
    - name: catalog-vs-stable
      interval: 1m
      failureLimit: 0
      consecutiveErrorLimit: 4
      successCondition: result[0] <= 6
      failureCondition: result[0] > 6
      provider:
        prometheus:
          address: http://prometheus-operated.monitoring.svc:9090
          query: |
            (
              slo_canary:catalog_vs_rest:burn_difference{rollouts_pod_template_hash="{{args.canary-hash}}"}
              and on(rollouts_pod_template_hash)
              slo_canary:catalog_vs_rest:zscore{rollouts_pod_template_hash="{{args.canary-hash}}"} > 3
              and on(rollouts_pod_template_hash)
              slo_canary:catalog_requests:increase5m{rollouts_pod_template_hash="{{args.canary-hash}}"} >= 50
            )
            or on(rollouts_pod_template_hash)
            max by (rollouts_pod_template_hash) (up{job="storefront-api", rollouts_pod_template_hash="{{args.canary-hash}}"} == 1) * 0
    - name: catalog-burn-rate
      interval: 1m
      consecutiveErrorLimit: 4
      successCondition: result[0] <= 6
      failureCondition: result[0] < 0 # never: a burn rate isn't negative. Over 6 is inconclusive, see above
      provider:
        prometheus:
          address: http://prometheus-operated.monitoring.svc:9090
          query: |
            (
              slo_canary:catalog_errors:ratio_rate5m{rollouts_pod_template_hash="{{args.canary-hash}}"}
                / scalar(1 - slo:catalog_availability:objective)
              and on(rollouts_pod_template_hash)
              slo_canary:catalog_requests:increase5m{rollouts_pod_template_hash="{{args.canary-hash}}"} >= 50
            )
            or on(rollouts_pod_template_hash)
            max by (rollouts_pod_template_hash) (up{job="storefront-api", rollouts_pod_template_hash="{{args.canary-hash}}"} == 1) * 0

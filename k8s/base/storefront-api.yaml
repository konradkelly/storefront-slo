apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-api
  namespace: storefront
spec:
  # Flyway seeds the catalog exactly once (verified with 3 replicas starting together), so any count is safe.
  # Going to 3 comes with the PodDisruptionBudget and spread constraints in Phase 2.2.
  replicas: 1
  selector:
    matchLabels:
      app: storefront-api
  template:
    metadata:
      labels:
        app: storefront-api
    spec:
      containers:
        - name: storefront-api
          image: storefront-api # each overlay sets the registry and tag
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/storefront
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: storefront-db
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: storefront-db
                  key: POSTGRES_PASSWORD
            - name: PAYMENT_FAILURE_RATE
              value: "0.001"
            - name: PAYMENT_LATENCY_MS
              value: "150"
            - name: CHECKOUT_MODE
              value: saga
          # The startup probe holds off the other two until the app is up. Startup time varies a lot (about 10s in
          # Compose, 60-70s on a busy kind cluster), and a fixed initialDelaySeconds on liveness raced it: pods
          # were killed seconds after logging "Started". This allows up to 3 minutes, then liveness takes over.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: storefront-api
  namespace: storefront
  labels:
    app: storefront-api
spec:
  selector:
    app: storefront-api
  ports:
    - name: http
      port: 8080
      targetPort: http

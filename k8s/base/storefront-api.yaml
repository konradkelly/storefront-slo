apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-api
  namespace: storefront
spec:
  # No `replicas`: the KEDA ScaledObject (autoscaling.yaml) owns the count, at least 3 (one per zone). The
  # PodDisruptionBudget (pdb.yaml) keeps at least 2 serving during drains. Never re-add `replicas` here:
  # every `kubectl apply` would reset the count and fight the autoscaler.
  strategy:
    rollingUpdate:
      maxSurge: 1        # start one new pod at a time...
      maxUnavailable: 0  # ...and only remove an old one once the new one is Ready
  selector:
    matchLabels:
      app: storefront-api
  template:
    metadata:
      labels:
        app: storefront-api
    spec:
      # Spread across zones (hard rule) and nodes (soft). pod-template-hash makes each rollout's new ReplicaSet
      # spread on its own instead of counting the old pods that are about to go away.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          # A cordoned (draining) node is tainted. Honor = leave its zone out of the skew calculation. Without this,
          # draining the only node in zone-b left the replacement Pending: placing it in zone a or c would put
          # that zone 2 ahead of the now-empty zone b (seen in exp4, 2026-10-06).
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app: storefront-api
          matchLabelKeys: [pod-template-hash]
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: storefront-api
          matchLabelKeys: [pod-template-hash]
      # Shutdown budget: 10s preStop sleep + up to 20s for Spring to finish in-flight requests
      # (spring.lifecycle.timeout-per-shutdown-phase) + margin.
      terminationGracePeriodSeconds: 45
      containers:
        - name: storefront-api
          image: storefront-api # each overlay sets the registry and tag
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # On termination the pod is removed from the Service, but kube-proxy on each node updates its rules a moment
          # later, so requests can keep arriving for a few seconds. Keep serving them during this sleep. SIGTERM
          # comes after it, and Spring's graceful shutdown then drains whatever is still in flight.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          env:
            # storefront-db-rw always points at the current primary, so a failover needs no app change.
            # The credentials Secret is generated by CloudNativePG (k8s/base/postgres.yaml).
            - name: DB_URL
              value: jdbc:postgresql://storefront-db-rw:5432/storefront
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: storefront-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: storefront-db-app
                  key: password
            - name: PAYMENT_FAILURE_RATE
              value: "0.001"
            - name: PAYMENT_LATENCY_MS
              value: "150"
            - name: CHECKOUT_MODE
              value: saga
          # The startup probe holds off the other two until the app is up. Startup time varies a lot (about 10s in
          # Compose, 60-70s on a busy kind cluster), and a fixed initialDelaySeconds on liveness raced it: pods
          # were killed seconds after logging "Started". This allows up to 3 minutes, then liveness takes over.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: storefront-api
  namespace: storefront
  labels:
    app: storefront-api
spec:
  selector:
    app: storefront-api
  ports:
    - name: http
      port: 8080
      targetPort: http

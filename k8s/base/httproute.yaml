# Public routes to storefront-api through the cluster Gateway (k8s/gateway/gateway.yaml). Only the API paths are
# exposed: /actuator (health, Prometheus metrics, app internals) stays reachable inside the cluster only. Each
# overlay sets the hostname (kind: storefront.localhost).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: storefront-api
  namespace: storefront
spec:
  parentRefs:
    - name: storefront
      namespace: gateway
  rules:
    - matches:
        - path: { type: PathPrefix, value: /products }
        - path: { type: PathPrefix, value: /cart }
        - path: { type: PathPrefix, value: /orders }
      # Stable and canary (rollout.yaml). Argo Rollouts' Gateway API plugin moves the weights during a release, and
      # Argo CD leaves them alone (k8s/platform/templates/storefront.yaml). Between releases it's 100/0.
      backendRefs:
        - name: storefront-api
          port: 8080
          weight: 100
        - name: storefront-api-canary
          port: 8080
          weight: 0

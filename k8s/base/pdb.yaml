# Voluntary disruptions (node drains, cluster upgrades, autoscaler scale-down) go through the eviction API, which
# refuses to evict a storefront-api pod if that would leave fewer than 2 Ready. A drain then waits for a replacement
# to come up elsewhere before taking the next one. This doesn't protect against involuntary loss (a node crash).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: storefront-api
  namespace: storefront
  annotations:
    # kube-linter compares minAvailable with the Deployment's replicas, 0. The Rollout runs the pods (rollout.yaml),
    # at least 3.
    ignore-check.kube-linter.io/pdb-min-available: "the Rollout runs the pods; the Deployment is its template"
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: storefront-api

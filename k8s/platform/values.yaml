# Defaults for every cluster. values-<cluster>.yaml overrides them, and scripts/argocd-up.sh sets the per-run values
# (revision, domain, grafanaCloudUrl, and on EKS vpcId, nlbEipAllocations, adminCidrs) on the root Application.

repoURL: https://github.com/konradkelly/storefront-slo.git
# The git revision every child app tracks. REVISION=<branch> bash scripts/argocd-up.sh tries a pushed branch.
revision: main

# k3s and EKS, set by scripts/k3s-up.sh and eks-up.sh: the monitoring UIs answer on <name>.<domain>
# (<public IP>.sslip.io), and grafanaCloudUrl turns on remote write (files/kps-remote-write.yaml). Empty on kind.
domain: ""
grafanaCloudUrl: ""

# EKS only, from terraform/aws/eks: the VPC the load balancer controller works in (it can't read it from instance
# metadata), the NLB's Elastic IPs (comma-separated allocation IDs), and who may reach the NLB.
vpcId: ""
nlbEipAllocations: ""
adminCidrs: []

# The storefront app (an overlay of k8s/base) and the cluster's own manifests (k8s/cluster/<cluster>).
storefrontPath: k8s/overlays/kind-gitops
clusterConfigPath: k8s/cluster/kind
# EKS only: the Secrets External Secrets makes, synced at wave -3 (templates/cluster-config.yaml). Empty: no such app.
secretsConfigPath: ""

# Helm charts, one Application each, in sync-wave order: Argo CD applies a wave only once every app in the waves
# before it is Healthy. So operators come up before anything that needs their CRDs or webhooks:
#   -4 monitoring-config (the Alertmanager config Secret must exist before Alertmanager starts), External Secrets (EKS)
#   -3 kube-prometheus-stack (ServiceMonitor/PodMonitor CRDs, which the other charts create), cert-manager,
#      secrets-config (EKS: the Secrets Alertmanager and Prometheus need)
#   -2 the other operators (Argo Rollouts among them)
#   -1 cluster-config (Gateway, routes, Probe), blackbox-exporter
#    0 the storefront
# values: files in this repo, layered in order. Versions are pinned; upgrade one chart at a time.
charts:
  kube-prometheus-stack:
    enabled: true
    repo: https://prometheus-community.github.io/helm-charts
    version: 91.9.0
    release: kps
    namespace: monitoring
    wave: -3
    values: [k8s/monitoring/kps-values.yaml]
  cloudnative-pg:
    enabled: true
    repo: https://cloudnative-pg.github.io/charts
    version: 0.29.1 # operator 1.30.1
    release: cnpg
    namespace: cnpg-system
    wave: -2
    values: [k8s/monitoring/cnpg-values.yaml]
  metrics-server:
    enabled: true
    repo: https://kubernetes-sigs.github.io/metrics-server/
    version: 3.14.0 # app 0.9.0; pod CPU for kubectl top and the KEDA cpu trigger
    release: metrics-server
    namespace: kube-system
    wave: -2
    values: [k8s/monitoring/metrics-server-values.yaml]
  keda:
    enabled: true
    repo: https://kedacore.github.io/charts
    version: 2.21.0
    release: keda
    namespace: keda
    wave: -2
    values: [k8s/monitoring/keda-values.yaml]
  envoy-gateway:
    enabled: true
    # An OCI chart: no chart name, the repo URL is the chart. ingress-nginx was retired in March 2026.
    repo: oci://registry-1.docker.io/envoyproxy/gateway-helm
    version: 1.9.2
    release: eg
    namespace: envoy-gateway-system
    wave: -2
  argo-rollouts:
    enabled: true
    repo: https://argoproj.github.io/argo-helm
    version: 2.43.8 # controller v1.10.1; canary releases of storefront-api (k8s/base/rollout.yaml)
    release: argo-rollouts
    namespace: argo-rollouts
    wave: -2
    values: [k8s/monitoring/argo-rollouts-values.yaml]
  prometheus-blackbox-exporter:
    enabled: true
    repo: https://prometheus-community.github.io/helm-charts
    version: 11.20.2 # blackbox-exporter v0.29.1; runs the synthetic probe (k8s/monitoring/storefront-probe.yaml)
    release: blackbox
    namespace: monitoring
    wave: -1
    values: [k8s/monitoring/blackbox-values.yaml]
  # CloudNativePG backups to S3 (k3s): the Barman Cloud plugin, which needs cert-manager for its TLS certificates.
  cert-manager:
    enabled: false
    repo: https://charts.jetstack.io
    version: v1.21.2
    release: cert-manager
    namespace: cert-manager
    wave: -3
    valuesObject:
      crds:
        enabled: true
  plugin-barman-cloud:
    enabled: false
    repo: https://cloudnative-pg.github.io/charts
    version: 0.8.1 # plugin v0.15.1
    release: barman-cloud
    namespace: cnpg-system
    wave: -2
  # EKS: Kubernetes Secrets from Parameter Store (/storefront/, put there by scripts/secrets-push.sh), read through Pod
  # Identity (terraform/aws/eks/platform.tf). Wave -4, before kube-prometheus-stack: Alertmanager and Prometheus need
  # two of those Secrets, which secretsConfigPath's app (wave -3) asks for. The release name is the controller's
  # service account name, which the Pod Identity association names.
  external-secrets:
    enabled: false
    repo: https://charts.external-secrets.io
    version: 2.15.0
    release: external-secrets
    namespace: external-secrets
    wave: -4
    values: [k8s/monitoring/external-secrets-values.yaml]
  # EKS: turns the Gateway's LoadBalancer Service into a Network Load Balancer (k8s/gateway/gateway-eks.yaml). Wave -2,
  # so it runs before cluster-config creates the Gateway. Its IAM policy is pinned with it (terraform/aws/eks).
  aws-load-balancer-controller:
    enabled: false
    repo: https://aws.github.io/eks-charts
    version: 3.6.3 # controller v3.6.3; the chart version matches since v3
    release: aws-load-balancer-controller
    namespace: kube-system
    wave: -2
    values: [k8s/monitoring/aws-lbc-values.yaml]

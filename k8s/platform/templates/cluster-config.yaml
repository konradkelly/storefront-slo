# Plain manifests, no charts. monitoring-config comes first: it holds the Alertmanager config Secret, and Alertmanager
# (kube-prometheus-stack, wave -3) won't start without it. cluster-config needs CRDs from the charts: the Gateway
# from Envoy Gateway, the Probe and PrometheusRules from kube-prometheus-stack.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: platform
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: k8s/cluster/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    {{- include "platform.syncPolicy" . | nindent 4 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: platform
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: {{ .Values.clusterConfigPath }}
    {{- if or .Values.domain .Values.nlbEipAllocations .Values.adminCidrs }}
    kustomize:
      patches:
        {{- if .Values.domain }}
        # *.localhost only resolves on your own machine. Elsewhere, <name>.<public IP>.sslip.io resolves to that IP.
        {{- range list "grafana" "prometheus" "alertmanager" }}
        - target:
            kind: HTTPRoute
            name: {{ . }}
          patch: |-
            - op: replace
              path: /spec/hostnames
              value: [{{ . }}.{{ $.Values.domain }}]
        {{- end }}
        {{- end }}
        {{- if .Values.nlbEipAllocations }}
        # EKS: the NLB takes the Elastic IPs Terraform made, so its addresses are known before it exists.
        - target:
            kind: EnvoyProxy
            name: eks-nlb
          patch: |-
            - op: add
              path: /spec/provider/kubernetes/envoyService/annotations/service.beta.kubernetes.io~1aws-load-balancer-eip-allocations
              value: {{ .Values.nlbEipAllocations | quote }}
        {{- end }}
        {{- if .Values.adminCidrs }}
        # EKS: only these addresses may connect, as on k3s, where the security group admits only admin_cidrs.
        - target:
            kind: EnvoyProxy
            name: eks-nlb
          patch: |-
            - op: add
              path: /spec/provider/kubernetes/envoyService/loadBalancerSourceRanges
              value: {{ .Values.adminCidrs | toJson }}
        {{- end }}
    {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    {{- include "platform.syncPolicy" . | nindent 4 }}

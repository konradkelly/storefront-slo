# The storefront app, last: it needs CloudNativePG, KEDA, the Gateway and the monitoring CRDs. Its project only
# reaches the storefront namespace, and pruning stays off so a bad commit can't delete the database.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: storefront
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  sourceRepos:
    - {{ .Values.repoURL }}
  destinations:
    - namespace: storefront
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storefront
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: storefront
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: {{ .Values.storefrontPath }}
  destination:
    server: https://kubernetes.default.svc
    namespace: storefront
  syncPolicy:
    automated:
      selfHeal: true
      # Keep database/namespace deletion out of unattended reconciliation.
      prune: false
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  # Fields other controllers own. RespectIgnoreDifferences keeps a sync from resetting them too.
  ignoreDifferences:
    # The Rollout keeps the Deployment at 0 (k8s/base/rollout.yaml).
    - group: apps
      kind: Deployment
      name: storefront-api
      namespace: storefront
      jsonPointers:
        - /spec/replicas
    # KEDA owns the Rollout's count. git sets it only when the Rollout is created.
    - group: argoproj.io
      kind: Rollout
      name: storefront-api
      namespace: storefront
      jsonPointers:
        - /spec/replicas
    # Argo Rollouts moves traffic between stable and canary here during a release.
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: storefront-api
      namespace: storefront
      jqPathExpressions:
        - .spec.rules[].backendRefs[].weight

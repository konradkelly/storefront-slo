# EKS (scripts/eks-up.sh, Phase 4b). Differences from k3s, each one something EKS or another AWS service now does
# (docs/eks.md): the AWS Load Balancer Controller puts a Network Load Balancer in front of Envoy Gateway, Postgres
# backs up to S3 with Pod Identity instead of a static key, and Prometheus labels what it sends with eks-aws.
storefrontPath: k8s/overlays/eks
clusterConfigPath: k8s/cluster/eks

charts:
  kube-prometheus-stack:
    values: [k8s/monitoring/kps-values.yaml, k8s/monitoring/kps-values-eks.yaml]
  cert-manager:
    enabled: true
  plugin-barman-cloud:
    enabled: true
  aws-load-balancer-controller:
    enabled: true

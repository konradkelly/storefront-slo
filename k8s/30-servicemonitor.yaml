# kube-prometheus-stack only picks up ServiceMonitors whose "release" label
# matches the Helm release name. The README installs the chart as "kps".
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: storefront-api
  namespace: storefront
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      app: storefront-api
  namespaceSelector:
    matchNames:
      - storefront
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s

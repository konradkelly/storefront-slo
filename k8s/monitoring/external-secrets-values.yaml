# External Secrets (chart 2.15.0), EKS only (k8s/platform/values-eks.yaml). It reads Parameter Store with its Pod
# Identity role (terraform/aws/eks/platform.tf): with no auth in the ClusterSecretStore, the AWS SDK's default chain
# finds the Pod Identity agent. Its webhook certificate comes from its own cert-controller, which fills in the CA at
# runtime: the chart renders no CA, so Argo CD's re-renders can't get out of step with it (unlike the load balancer
# controller's, k8s/monitoring/aws-lbc-values.yaml).
#
# Three small pods. The nodes have little memory to spare (docs/eks.md), so requests are set and limits are modest.
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi
webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
certController:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

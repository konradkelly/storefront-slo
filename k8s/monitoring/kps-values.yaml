# kube-prometheus-stack values (chart 91.9.0), the same on kind and k3s. Argo CD installs the chart
# (k8s/platform/values.yaml).

# kind runs etcd, the scheduler, the controller manager and kube-proxy with metrics bound to localhost, so
# Prometheus can't scrape them and their "...Down" alerts would fire forever. k3s runs them all inside one k3s
# process (and a single server uses SQLite, not etcd), with the same result. Turn off the scrapes and rules.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
defaultRules:
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
    kubeProxy: false
    windows: false

prometheus:
  prometheusSpec:
    # The SLOs use a 28d window. A lab cluster rarely lives that long, but don't throw data away before then.
    # Storage is an emptyDir: a Prometheus pod restart starts from empty (fine for a lab).
    retention: 30d
    retentionSize: 4GB
    # k6 Jobs push their client-side metrics here (k8s/loadtest/k6-job.yaml). Nothing else can reach it: the
    # storefront NetworkPolicies let only the load-test pods out to port 9090.
    enableRemoteWriteReceiver: true
    resources:
      requests:
        cpu: 200m
        memory: 600Mi
      limits:
        memory: 1500Mi

alertmanager:
  alertmanagerSpec:
    # The config is alertmanager/alertmanager.yml plus its Slack template, shared with Compose. k8s/cluster/monitoring
    # builds this Secret from those files, so the chart doesn't generate one of its own.
    useExistingSecret: true
    configSecret: alertmanager-storefront
    # Slack webhook URLs, created by the bootstrap script from the gitignored alertmanager/secrets/ files.
    # Mounted at /etc/alertmanager/secrets/alertmanager-slack/, the path alertmanager.yml reads.
    secrets:
      - alertmanager-slack
    resources:
      requests:
        cpu: 20m
        memory: 64Mi

grafana:
  adminPassword: admin # lab only; same as Compose
  sidecar:
    dashboards:
      # Load every ConfigMap labeled grafana_dashboard=1, like the storefront dashboards.
      enabled: true
      label: grafana_dashboard
      folder: /tmp/dashboards
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  resources:
    requests:
      cpu: 50m
      memory: 200Mi

# Learning setup only: data lives in an emptyDir and disappears if the pod restarts.
apiVersion: v1
kind: Secret
metadata:
  name: storefront-db
  namespace: storefront
type: Opaque
stringData:
  POSTGRES_DB: storefront
  POSTGRES_USER: storefront
  POSTGRES_PASSWORD: storefront
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: storefront
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          envFrom:
            - secretRef:
                name: storefront-db
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "storefront", "-d", "storefront"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: storefront
spec:
  selector:
    app: postgres
  ports:
    - port: 5432

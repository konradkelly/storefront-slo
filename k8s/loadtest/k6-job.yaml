# Create the script ConfigMap first:
#   kubectl -n storefront create configmap k6-script --from-file=loadtest/checkout.js
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load
  namespace: storefront
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/component: loadtest # matched by the storefront NetworkPolicies
    spec:
      restartPolicy: Never
      # Pod Security "restricted" (enforced on the storefront namespace). The k6 image runs as a non-root user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k6
          image: grafana/k6:2.3.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args: ["run", "/scripts/checkout.js"]
          env:
            - name: BASE_URL
              value: http://storefront-api.storefront.svc:8080
            # browse (realistic, default) or checkout-stress (saga vs. single-tx experiment)
            - name: PROFILE
              value: browse
            # The client's view as time series in Prometheus (its remote-write receiver, kps-values.yaml), next to
            # the API's own metrics: failures that never reach the API, such as refused connections, show up only
            # here. Trends go out as these stats per push. For runs longer than a few hours, also set
            # K6_SUMMARY_MODE=disabled and K6_NO_THRESHOLDS=true: otherwise k6 keeps every timing sample in memory
            # for its end-of-test summary (1.3 GiB after a 72-hour soak). Experiments 3-5 read that summary.
            - name: K6_OUT
              value: experimental-prometheus-rw
            - name: K6_PROMETHEUS_RW_SERVER_URL
              value: http://kps-kube-prometheus-stack-prometheus.monitoring.svc:9090/api/v1/write
            - name: K6_PROMETHEUS_RW_TREND_STATS
              value: p(95),p(99),max
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: k6-script

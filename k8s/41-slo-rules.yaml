            (
              (sum(rate(http_server_requests_seconds_count{application="storefront-api", uri="/orders", method="POST", status=~"5.."}[5m])) or vector(0))
              +
              (sum(rate(storefront_checkouts_total{application="storefront-api", status="payment_failed"}[5m])) or vector(0))
            )

services:
  postgres:
    image: postgres:16.14
    environment:
      POSTGRES_DB: storefront
      POSTGRES_USER: storefront
      POSTGRES_PASSWORD: storefront
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storefront -d storefront"]
      interval: 5s
      retries: 10

  storefront-api:
    build: ./app
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/storefront
      DB_USER: storefront
      DB_PASSWORD: storefront
      PAYMENT_FAILURE_RATE: "0.001"
      PAYMENT_LATENCY_MS: "150"
      CHECKOUT_MODE: ${CHECKOUT_MODE:-saga}
      RESTOCK_INTERVAL_MS: ${RESTOCK_INTERVAL_MS:-60000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    ports:
      - "9090:9090"
    depends_on:
      - storefront-api
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.34.1
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      - ./alertmanager/secrets:/etc/alertmanager/secrets:ro
    ports:
      - "9093:9093"
    depends_on:
      - alert-logger

  # Local stand-in for Slack. `docker compose logs -f alert-logger` shows every notification and its channel.
  alert-logger:
    image: python:3.13.16-alpine
    command: ["python", "/app/webhook-logger.py"]
    volumes:
      - ./alertmanager/webhook-logger.py:/app/webhook-logger.py:ro

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:2.3.0
    profiles: ["load"]
    command: run /scripts/checkout.js
    environment:
      BASE_URL: http://storefront-api:8080
      DURATION: 15m
    volumes:
      - ./loadtest:/scripts:ro
    depends_on:
      - storefront-api      
    
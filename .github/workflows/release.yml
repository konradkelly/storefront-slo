name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-kind
  cancel-in-progress: false

jobs:
  release:
    # Never execute PR code with publishing credentials. Manual CI runs also
    # qualify, but only after all checks have succeeded on this repo's main.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Identify source and registry image
        id: image
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build tested image
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha }}
        run: >-
          docker build --pull --tag "$IMAGE"
          --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
          --label "org.opencontainers.image.revision=${{ steps.image.outputs.sha }}" app
      - name: Scan image and generate SBOM
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha }}
        run: bash scripts/scan-image.sh "$IMAGE" "$RUNNER_TEMP/image-reports"
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-security-${{ steps.image.outputs.sha }}
          path: ${{ runner.temp }}/image-reports/
          if-no-files-found: ignore
          retention-days: 14
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push SHA-tagged image
        id: push
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha }}
        shell: bash
        run: |
          docker push "$IMAGE"
          reference=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "digest=${reference#*@}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        with:
          cosign-release: v3.1.3
      - name: Sign image and attest SBOM with GitHub OIDC
        env:
          IMAGE_REFERENCE: ${{ steps.push.outputs.reference }}
        run: |
          cosign sign --yes "$IMAGE_REFERENCE"
          cosign attest --yes --type cyclonedx --predicate "$RUNNER_TEMP/image-reports/sbom.cdx.json" "$IMAGE_REFERENCE"
      - name: Promote digest in Git
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          SOURCE_SHA: ${{ steps.image.outputs.sha }}
        run: bash scripts/promote-image.sh

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/pom.xml
      - name: Verify app against Testcontainers Postgres
        working-directory: app
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-test-reports
          path: app/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  prometheus:
    name: Prometheus rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check rule syntax
        run: >-
          docker run --rm -v "$PWD/prometheus:/src" -w /src
          --entrypoint promtool prom/prometheus:v3.15.0
          check rules rules/slo.yml rules/slo-alerts.yml
      - name: Test SLO rules and alerts
        run: >-
          docker run --rm -v "$PWD/prometheus:/src" -w /src
          --entrypoint promtool prom/prometheus:v3.15.0
          test rules tests/slo_test.yml tests/slo_alerts_test.yml
      - name: Check generated Kubernetes rules are current
        run: |
          sh scripts/gen-k8s-rules.sh
          git diff --exit-code -- k8s/base/slo-rules.yaml k8s/base/slo-alerts.yaml

  kubernetes:
    name: Kubernetes manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned validation tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-tools"
          cd "$RUNNER_TEMP/ci-tools"
          curl --fail --silent --show-error --location https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz -o kubeconform.tar.gz
          echo '9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tar.gz' | sha256sum --check
          tar -xzf kubeconform.tar.gz kubeconform
          curl --fail --silent --show-error --location https://github.com/stackrox/kube-linter/releases/download/v0.8.3/kube-linter-linux.tar.gz -o kube-linter.tar.gz
          echo '1a6d8419b11971372971fdbc22682b684ebfb7cf1c39591662d1b6ca736c41df  kube-linter.tar.gz' | sha256sum --check
          tar -xzf kube-linter.tar.gz kube-linter
          curl --fail --silent --show-error --location https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl -o kubectl
          curl --fail --silent --show-error --location https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl.sha256 -o kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl kubeconform kube-linter
          echo "$RUNNER_TEMP/ci-tools" >> "$GITHUB_PATH"
      - name: Render, validate and lint
        run: bash scripts/ci-k8s-check.sh

  smoke:
    name: Kubernetes SLO smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build smoke-test image
        run: docker build --tag storefront-api:ci app
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          cluster_name: storefront-ci
          node_image: kindest/node:v1.34.0
          kubectl_version: v1.34.1
          wait: 120s
      - name: Warm up and test checkout SLOs for two minutes
        run: bash scripts/ci-smoke.sh
      - name: Delete disposable cluster
        if: always()
        run: kind delete cluster --name storefront-ci

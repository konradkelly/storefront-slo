spring:
  application:
    name: storefront-api
  lifecycle:
    # How long graceful shutdown waits for in-flight requests (k8s terminationGracePeriodSeconds covers this
    # plus the preStop sleep).
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/storefront}
    username: ${DB_USER:storefront}
    password: ${DB_PASSWORD:storefront}
    hikari:
      # How long a request waits for a pooled connection before it fails with a 500 (ms). The default, 30 s, made
      # the k3s control-plane outage invisible (docs/postmortems/2026-10-29-k3s-control-plane-stop.md): every request
      # hung for half a minute, clients slowed down to match, and the SLIs recorded about 1% of the failures. A user
      # gives up long before 30 s anyway. The cost: during a CloudNativePG failover (about 20 s of queueing in the
      # Phase 2.1 experiment) requests now fail after 5 s instead of waiting it out.
      connection-timeout: 5000
  jpa:
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks that the entities match it,
      # so an entity change without a migration fails at startup instead of silently altering tables.
      ddl-auto: validate
    open-in-view: false
  flyway:
    placeholders:
      initial_stock: ${storefront.restock-level}

server:
  # On SIGTERM: stop accepting new requests, finish the ones in flight, then exit. Spring Boot 3.4+ defaults to this
  # too; it stays explicit because "immediate" drops in-flight requests during every rolling update.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: storefront-api
    distribution:
      percentiles-histogram:
        http.server.requests: true
      # Exact bucket boundaries for latency SLOs (docs/slo.md). Without them the nearest
      # default buckets are 0.447s and 0.537s, and "under 500ms" can't be counted exactly.
      slo:
        http.server.requests: 100ms,300ms,500ms,1s

storefront:
  # saga (default) or single-tx. See OrderService for the difference.
  checkout-mode: ${CHECKOUT_MODE:saga}
  reservation-timeout-ms: ${RESERVATION_TIMEOUT_MS:120000}
  reservation-sweep-interval-ms: ${RESERVATION_SWEEP_INTERVAL_MS:30000}
  restock-level: ${RESTOCK_LEVEL:200}
  restock-interval-ms: ${RESTOCK_INTERVAL_MS:60000}
  payment:
    failure-rate: ${PAYMENT_FAILURE_RATE:0.001}
    latency-ms: ${PAYMENT_LATENCY_MS:150}

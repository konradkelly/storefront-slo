# Unit tests for prometheus/rules/canary.yml. Run from the repo root:
#   docker run --rm -v "$PWD/prometheus:/src" -w /src --entrypoint promtool \
#     prom/prometheus:v3.15.0 test rules tests/canary_test.yml
rule_files:
  - ../rules/canary.yml
  - ../rules/slo.yml

evaluation_interval: 1m
fuzzy_compare: true

tests:
  # Two versions side by side. stable (hash "aaa") returns no 5xx at all, so its 500 series doesn't exist: it must get
  # 0, not drop out. canary ("bbb") fails 10 of 100 checkouts with a 500. Payment declines (402) count as valid
  # checkouts but not as errors, and 400/409 count as neither.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="aaa", uri="/orders", method="POST", status="201"}'
        values: '0+95x30'
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="aaa", uri="/orders", method="POST", status="402"}'
        values: '0+5x30'
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="bbb", uri="/orders", method="POST", status="201"}'
        values: '0+88x30'
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="bbb", uri="/orders", method="POST", status="402"}'
        values: '0+2x30'
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="bbb", uri="/orders", method="POST", status="500"}'
        values: '0+10x30'
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="bbb", uri="/orders", method="POST", status="409"}'
        values: '0+40x30'
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="bbb", uri="/orders", method="POST", status="400"}'
        values: '0+40x30'
      - series: 'up{job="storefront-api", rollouts_pod_template_hash="bbb"}'
        values: '1x30'
    promql_expr_test:
      - expr: slo_canary:checkout_errors:ratio_rate5m
        eval_time: 20m
        exp_samples:
          - labels: 'slo_canary:checkout_errors:ratio_rate5m{rollouts_pod_template_hash="aaa"}'
            value: 0
          - labels: 'slo_canary:checkout_errors:ratio_rate5m{rollouts_pod_template_hash="bbb"}'
            value: 0.1
      # 100 valid checkouts a minute for 5 minutes.
      - expr: slo_canary:checkout_requests:increase5m
        eval_time: 20m
        exp_samples:
          - labels: 'slo_canary:checkout_requests:increase5m{rollouts_pod_template_hash="aaa"}'
            value: 500
          - labels: 'slo_canary:checkout_requests:increase5m{rollouts_pod_template_hash="bbb"}'
            value: 500
      # The analysis query (k8s/base/rollout.yaml) for the canary: 10% errors against a 0.5% budget is a burn rate
      # of 20, over its limit of 6. 1 - 0.995 isn't exact in floating point (19.999999999999982), so check it's
      # within 1e-9. The `or` adds nothing: the burn rate already has this version's labels.
      - expr: |
          abs((
            (
              slo_canary:checkout_errors:ratio_rate5m{rollouts_pod_template_hash="bbb"}
                / scalar(1 - slo:checkout_availability:objective)
              and on(rollouts_pod_template_hash)
              slo_canary:checkout_requests:increase5m{rollouts_pod_template_hash="bbb"} >= 50
            )
            or on(rollouts_pod_template_hash)
            max by (rollouts_pod_template_hash) (up{job="storefront-api", rollouts_pod_template_hash="bbb"} == 1) * 0
          ) - 20) < bool 1e-9
        eval_time: 20m
        exp_samples:
          - labels: '{rollouts_pod_template_hash="bbb"}'
            value: 1

  # A canary that has served only a few checkouts gets no verdict: 0, which passes, as long as Prometheus is scraping
  # it.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="bbb", uri="/orders", method="POST", status="201"}'
        values: '0+4x30'
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="bbb", uri="/orders", method="POST", status="500"}'
        values: '0+1x30'
      - series: 'up{job="storefront-api", rollouts_pod_template_hash="bbb"}'
        values: '1x30'
    promql_expr_test:
      - expr: |
          (
            slo_canary:checkout_errors:ratio_rate5m{rollouts_pod_template_hash="bbb"}
              / scalar(1 - slo:checkout_availability:objective)
            and on(rollouts_pod_template_hash)
            slo_canary:checkout_requests:increase5m{rollouts_pod_template_hash="bbb"} >= 50
          )
          or on(rollouts_pod_template_hash)
          max by (rollouts_pod_template_hash) (up{job="storefront-api", rollouts_pod_template_hash="bbb"} == 1) * 0
        eval_time: 20m
        exp_samples:
          - labels: '{rollouts_pod_template_hash="bbb"}'
            value: 0

  # Prometheus can't see the canary: its scrapes fail (up 0) and its request series are gone. The query returns nothing,
  # which the analysis counts as an error, and 4 in a row abort the release.
  - interval: 1m
    input_series:
      - series: 'up{job="storefront-api", rollouts_pod_template_hash="bbb"}'
        values: '0x30'
    promql_expr_test:
      - expr: |
          (
            slo_canary:checkout_errors:ratio_rate5m{rollouts_pod_template_hash="bbb"}
              / scalar(1 - slo:checkout_availability:objective)
            and on(rollouts_pod_template_hash)
            slo_canary:checkout_requests:increase5m{rollouts_pod_template_hash="bbb"} >= 50
          )
          or on(rollouts_pod_template_hash)
          max by (rollouts_pod_template_hash) (up{job="storefront-api", rollouts_pod_template_hash="bbb"} == 1) * 0
        eval_time: 20m
        exp_samples: []

  # Catalog: 5xx on any /products route, per version.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="aaa", uri="/products", method="GET", status="200"}'
        values: '0+100x30'
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="bbb", uri="/products/{id}", method="GET", status="200"}'
        values: '0+97x30'
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="bbb", uri="/products/{id}", method="GET", status="503"}'
        values: '0+3x30'
    promql_expr_test:
      - expr: slo_canary:catalog_errors:ratio_rate5m
        eval_time: 20m
        exp_samples:
          - labels: 'slo_canary:catalog_errors:ratio_rate5m{rollouts_pod_template_hash="aaa"}'
            value: 0
          - labels: 'slo_canary:catalog_errors:ratio_rate5m{rollouts_pod_template_hash="bbb"}'
            value: 0.03
      - expr: slo_canary:catalog_requests:increase5m
        eval_time: 20m
        exp_samples:
          - labels: 'slo_canary:catalog_requests:increase5m{rollouts_pod_template_hash="aaa"}'
            value: 500
          - labels: 'slo_canary:catalog_requests:increase5m{rollouts_pod_template_hash="bbb"}'
            value: 500

  # The comparison with the rest of the traffic, for the first scenario: stable (aaa) no 5xx, canary (bbb) 10% of 500
  # checkouts. Pooled error ratio 5%, z 7.25 either way round, and the canary burns 20 faster than stable (within 1e-9),
  # over 6: checkout-vs-stable aborts. Each version is compared with the other, so stable's numbers are the mirror image.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="aaa", uri="/orders", method="POST", status="201"}'
        values: '0+100x30'
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="bbb", uri="/orders", method="POST", status="201"}'
        values: '0+90x30'
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="bbb", uri="/orders", method="POST", status="500"}'
        values: '0+10x30'
      - series: 'up{job="storefront-api", rollouts_pod_template_hash="bbb"}'
        values: '1x30'
    promql_expr_test:
      - expr: |
          round(slo_canary:checkout_vs_rest:zscore{rollouts_pod_template_hash="bbb"}, 0.01)
        eval_time: 20m
        exp_samples:
          - labels: '{rollouts_pod_template_hash="bbb"}'
            value: 7.25
      - expr: |
          round(slo_canary:checkout_vs_rest:zscore{rollouts_pod_template_hash="aaa"}, 0.01)
        eval_time: 20m
        exp_samples:
          - labels: '{rollouts_pod_template_hash="aaa"}'
            value: -7.25
      - expr: |
          abs((
            (
              slo_canary:checkout_vs_rest:burn_difference{rollouts_pod_template_hash="bbb"}
              and on(rollouts_pod_template_hash)
              slo_canary:checkout_vs_rest:zscore{rollouts_pod_template_hash="bbb"} > 3
              and on(rollouts_pod_template_hash)
              slo_canary:checkout_requests:increase5m{rollouts_pod_template_hash="bbb"} >= 50
            )
            or on(rollouts_pod_template_hash)
            max by (rollouts_pod_template_hash) (up{job="storefront-api", rollouts_pod_template_hash="bbb"} == 1) * 0
          ) - 20) < bool 1e-9
        eval_time: 20m
        exp_samples:
          - labels: '{rollouts_pod_template_hash="bbb"}'
            value: 1

  # A database outage during a canary: both versions fail half their checkouts with a 500. The canary's own burn rate is
  # 100 (within 1e-9), over 6, but it's no worse than stable: z 0, and the comparison gives 0. checkout-burn-rate is
  # inconclusive (it never fails) and checkout-vs-stable passes, so the Rollout pauses instead of failing a good release.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="aaa", uri="/orders", method="POST", status="201"}'
        values: '0+50x30'
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="aaa", uri="/orders", method="POST", status="500"}'
        values: '0+50x30'
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="bbb", uri="/orders", method="POST", status="201"}'
        values: '0+50x30'
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="bbb", uri="/orders", method="POST", status="500"}'
        values: '0+50x30'
      - series: 'up{job="storefront-api", rollouts_pod_template_hash="bbb"}'
        values: '1x30'
    promql_expr_test:
      - expr: |
          abs((
            (
              slo_canary:checkout_errors:ratio_rate5m{rollouts_pod_template_hash="bbb"}
                / scalar(1 - slo:checkout_availability:objective)
              and on(rollouts_pod_template_hash)
              slo_canary:checkout_requests:increase5m{rollouts_pod_template_hash="bbb"} >= 50
            )
            or on(rollouts_pod_template_hash)
            max by (rollouts_pod_template_hash) (up{job="storefront-api", rollouts_pod_template_hash="bbb"} == 1) * 0
          ) - 100) < bool 1e-9
        eval_time: 20m
        exp_samples:
          - labels: '{rollouts_pod_template_hash="bbb"}'
            value: 1
      - expr: |
          round(slo_canary:checkout_vs_rest:zscore{rollouts_pod_template_hash="bbb"}, 0.01)
        eval_time: 20m
        exp_samples:
          - labels: '{rollouts_pod_template_hash="bbb"}'
            value: 0
      - expr: |
          (
            slo_canary:checkout_vs_rest:burn_difference{rollouts_pod_template_hash="bbb"}
            and on(rollouts_pod_template_hash)
            slo_canary:checkout_vs_rest:zscore{rollouts_pod_template_hash="bbb"} > 3
            and on(rollouts_pod_template_hash)
            slo_canary:checkout_requests:increase5m{rollouts_pod_template_hash="bbb"} >= 50
          )
          or on(rollouts_pod_template_hash)
          max by (rollouts_pod_template_hash) (up{job="storefront-api", rollouts_pod_template_hash="bbb"} == 1) * 0
        eval_time: 20m
        exp_samples:
          - labels: '{rollouts_pod_template_hash="bbb"}'
            value: 0

  # The false abort the z-test exists for: an outage on both versions, halfway through filling the 5-minute windows. By
  # chance the canary's 100 checkouts have 40% errors and stable's 350 have 33%. The canary burns 14.29 faster, over 6,
  # but at z 1.33 that's chance: the comparison gives 0, and the canary's own burn rate pauses the Rollout.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="aaa", uri="/orders", method="POST", status="201"}'
        values: '0+47x30'
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="aaa", uri="/orders", method="POST", status="500"}'
        values: '0+23x30'
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="bbb", uri="/orders", method="POST", status="201"}'
        values: '0+12x30'
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="bbb", uri="/orders", method="POST", status="500"}'
        values: '0+8x30'
      - series: 'up{job="storefront-api", rollouts_pod_template_hash="bbb"}'
        values: '1x30'
    promql_expr_test:
      - expr: |
          round(slo_canary:checkout_vs_rest:burn_difference{rollouts_pod_template_hash="bbb"}, 0.01)
        eval_time: 20m
        exp_samples:
          - labels: '{rollouts_pod_template_hash="bbb"}'
            value: 14.29
      - expr: |
          round(slo_canary:checkout_vs_rest:zscore{rollouts_pod_template_hash="bbb"}, 0.01)
        eval_time: 20m
        exp_samples:
          - labels: '{rollouts_pod_template_hash="bbb"}'
            value: 1.33
      - expr: |
          (
            slo_canary:checkout_vs_rest:burn_difference{rollouts_pod_template_hash="bbb"}
            and on(rollouts_pod_template_hash)
            slo_canary:checkout_vs_rest:zscore{rollouts_pod_template_hash="bbb"} > 3
            and on(rollouts_pod_template_hash)
            slo_canary:checkout_requests:increase5m{rollouts_pod_template_hash="bbb"} >= 50
          )
          or on(rollouts_pod_template_hash)
          max by (rollouts_pod_template_hash) (up{job="storefront-api", rollouts_pod_template_hash="bbb"} == 1) * 0
        eval_time: 20m
        exp_samples:
          - labels: '{rollouts_pod_template_hash="bbb"}'
            value: 0

  # Stable has served too few checkouts to compare with (20 in 5 minutes), all of them failing: no comparison series
  # at all, so the check gives 0. The canary's own burn rate (20, within 1e-9) is over 6, so the Rollout pauses. A
  # handful of stable failures can't make a bad canary look fine.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="aaa", uri="/orders", method="POST", status="500"}'
        values: '0+4x30'
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="bbb", uri="/orders", method="POST", status="201"}'
        values: '0+90x30'
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="bbb", uri="/orders", method="POST", status="500"}'
        values: '0+10x30'
      - series: 'up{job="storefront-api", rollouts_pod_template_hash="bbb"}'
        values: '1x30'
    promql_expr_test:
      - expr: |
          slo_canary:checkout_vs_rest:burn_difference{rollouts_pod_template_hash="bbb"}
        eval_time: 20m
        exp_samples: []
      - expr: |
          (
            slo_canary:checkout_vs_rest:burn_difference{rollouts_pod_template_hash="bbb"}
            and on(rollouts_pod_template_hash)
            slo_canary:checkout_vs_rest:zscore{rollouts_pod_template_hash="bbb"} > 3
            and on(rollouts_pod_template_hash)
            slo_canary:checkout_requests:increase5m{rollouts_pod_template_hash="bbb"} >= 50
          )
          or on(rollouts_pod_template_hash)
          max by (rollouts_pod_template_hash) (up{job="storefront-api", rollouts_pod_template_hash="bbb"} == 1) * 0
        eval_time: 20m
        exp_samples:
          - labels: '{rollouts_pod_template_hash="bbb"}'
            value: 0
      - expr: |
          abs((
            (
              slo_canary:checkout_errors:ratio_rate5m{rollouts_pod_template_hash="bbb"}
                / scalar(1 - slo:checkout_availability:objective)
              and on(rollouts_pod_template_hash)
              slo_canary:checkout_requests:increase5m{rollouts_pod_template_hash="bbb"} >= 50
            )
            or on(rollouts_pod_template_hash)
            max by (rollouts_pod_template_hash) (up{job="storefront-api", rollouts_pod_template_hash="bbb"} == 1) * 0
          ) - 20) < bool 1e-9
        eval_time: 20m
        exp_samples:
          - labels: '{rollouts_pod_template_hash="bbb"}'
            value: 1

  # Like the canary's own burn rate, the comparison gives 0 for a canary with too few checkouts (while it's scraped), and
  # nothing when Prometheus can't see the canary (ccc): 4 errors in a row abort.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="aaa", uri="/orders", method="POST", status="201"}'
        values: '0+100x30'
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="bbb", uri="/orders", method="POST", status="500"}'
        values: '0+1x30'
      - series: 'up{job="storefront-api", rollouts_pod_template_hash="bbb"}'
        values: '1x30'
      - series: 'up{job="storefront-api", rollouts_pod_template_hash="ccc"}'
        values: '0x30'
    promql_expr_test:
      - expr: |
          (
            slo_canary:checkout_vs_rest:burn_difference{rollouts_pod_template_hash="bbb"}
            and on(rollouts_pod_template_hash)
            slo_canary:checkout_vs_rest:zscore{rollouts_pod_template_hash="bbb"} > 3
            and on(rollouts_pod_template_hash)
            slo_canary:checkout_requests:increase5m{rollouts_pod_template_hash="bbb"} >= 50
          )
          or on(rollouts_pod_template_hash)
          max by (rollouts_pod_template_hash) (up{job="storefront-api", rollouts_pod_template_hash="bbb"} == 1) * 0
        eval_time: 20m
        exp_samples:
          - labels: '{rollouts_pod_template_hash="bbb"}'
            value: 0
      - expr: |
          (
            slo_canary:checkout_vs_rest:burn_difference{rollouts_pod_template_hash="ccc"}
            and on(rollouts_pod_template_hash)
            slo_canary:checkout_vs_rest:zscore{rollouts_pod_template_hash="ccc"} > 3
            and on(rollouts_pod_template_hash)
            slo_canary:checkout_requests:increase5m{rollouts_pod_template_hash="ccc"} >= 50
          )
          or on(rollouts_pod_template_hash)
          max by (rollouts_pod_template_hash) (up{job="storefront-api", rollouts_pod_template_hash="ccc"} == 1) * 0
        eval_time: 20m
        exp_samples: []

  # Catalog: canary bbb 5% 5xx, stable aaa 1%, 500 requests each. z 3.71, and the canary burns 40 faster than stable
  # (0.04 against a 0.1% budget, within 1e-9), over 6: abort.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="aaa", uri="/products", method="GET", status="200"}'
        values: '0+99x30'
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="aaa", uri="/products", method="GET", status="500"}'
        values: '0+1x30'
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="bbb", uri="/products/{id}", method="GET", status="200"}'
        values: '0+95x30'
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="bbb", uri="/products/{id}", method="GET", status="500"}'
        values: '0+5x30'
      - series: 'up{job="storefront-api", rollouts_pod_template_hash="bbb"}'
        values: '1x30'
    promql_expr_test:
      - expr: |
          round(slo_canary:catalog_vs_rest:zscore{rollouts_pod_template_hash="bbb"}, 0.01)
        eval_time: 20m
        exp_samples:
          - labels: '{rollouts_pod_template_hash="bbb"}'
            value: 3.71
      - expr: |
          abs((
            (
              slo_canary:catalog_vs_rest:burn_difference{rollouts_pod_template_hash="bbb"}
              and on(rollouts_pod_template_hash)
              slo_canary:catalog_vs_rest:zscore{rollouts_pod_template_hash="bbb"} > 3
              and on(rollouts_pod_template_hash)
              slo_canary:catalog_requests:increase5m{rollouts_pod_template_hash="bbb"} >= 50
            )
            or on(rollouts_pod_template_hash)
            max by (rollouts_pod_template_hash) (up{job="storefront-api", rollouts_pod_template_hash="bbb"} == 1) * 0
          ) - 40) < bool 1e-9
        eval_time: 20m
        exp_samples:
          - labels: '{rollouts_pod_template_hash="bbb"}'
            value: 1

  # Catalog, not beyond chance: canary 3% against stable 1% is 15 errors against 5 in 500 requests each, z 2.26. The
  # comparison gives 0, and the canary's own burn rate (30) pauses it instead.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="aaa", uri="/products", method="GET", status="200"}'
        values: '0+99x30'
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="aaa", uri="/products", method="GET", status="500"}'
        values: '0+1x30'
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="bbb", uri="/products/{id}", method="GET", status="200"}'
        values: '0+97x30'
      - series: 'http_server_requests_seconds_count{application="storefront-api", rollouts_pod_template_hash="bbb", uri="/products/{id}", method="GET", status="500"}'
        values: '0+3x30'
      - series: 'up{job="storefront-api", rollouts_pod_template_hash="bbb"}'
        values: '1x30'
    promql_expr_test:
      - expr: |
          round(slo_canary:catalog_vs_rest:zscore{rollouts_pod_template_hash="bbb"}, 0.01)
        eval_time: 20m
        exp_samples:
          - labels: '{rollouts_pod_template_hash="bbb"}'
            value: 2.26
      - expr: |
          (
            slo_canary:catalog_vs_rest:burn_difference{rollouts_pod_template_hash="bbb"}
            and on(rollouts_pod_template_hash)
            slo_canary:catalog_vs_rest:zscore{rollouts_pod_template_hash="bbb"} > 3
            and on(rollouts_pod_template_hash)
            slo_canary:catalog_requests:increase5m{rollouts_pod_template_hash="bbb"} >= 50
          )
          or on(rollouts_pod_template_hash)
          max by (rollouts_pod_template_hash) (up{job="storefront-api", rollouts_pod_template_hash="bbb"} == 1) * 0
        eval_time: 20m
        exp_samples:
          - labels: '{rollouts_pod_template_hash="bbb"}'
            value: 0

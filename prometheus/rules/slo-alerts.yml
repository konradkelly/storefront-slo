          runbook_url: "https://github.com/konradkelly/storefront-slo/blob/main/docs/runbooks/StorefrontCatalogAvailabilityBudgetBurn.md"
      - alert: StorefrontCatalogAvailabilityBudgetBurn
        expr: |
          (
            (slo:catalog_availability:error_ratio_rate1d / on(slo) (1 - slo:catalog_availability:objective)) > 3
            and
            (slo:catalog_availability:error_ratio_rate2h / on(slo) (1 - slo:catalog_availability:objective)) > 3
          )
          or
          (
            (slo:catalog_availability:error_ratio_rate3d / on(slo) (1 - slo:catalog_availability:objective)) > 1
            and
            (slo:catalog_availability:error_ratio_rate6h / on(slo) (1 - slo:catalog_availability:objective)) > 1
          )
        labels:
          severity: ticket
          slo: catalog-availability
        annotations:
          summary: "Catalog availability is burning its error budget slowly"
          description: "Burning the 28-day error budget at {{ $value | printf \"%.1f\" }}x the sustainable rate."
          runbook_url: "https://github.com/konradkelly/storefront-slo/blob/main/docs/runbooks/StorefrontCatalogAvailabilityBudgetBurn.md"
      - alert: StorefrontCartAvailabilityBudgetBurn
        expr: |
          (
            (slo:cart_availability:error_ratio_rate1h / on(slo) (1 - slo:cart_availability:objective)) > 14.4
            and
            (slo:cart_availability:error_ratio_rate5m / on(slo) (1 - slo:cart_availability:objective)) > 14.4
          )
          or
          (
            (slo:cart_availability:error_ratio_rate6h / on(slo) (1 - slo:cart_availability:objective)) > 6
            and

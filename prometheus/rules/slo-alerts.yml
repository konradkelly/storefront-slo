          )
        labels:
          severity: page
          slo: cart-availability
        annotations:
          summary: "Cart availability is burning its error budget fast"
          description: "Burning the 28-day error budget at {{ $value | printf \"%.1f\" }}x the sustainable rate."
          runbook_url: "https://github.com/konradkelly/storefront-slo/blob/main/docs/runbooks/StorefrontCartAvailabilityBudgetBurn.md"
      - alert: StorefrontCartAvailabilityBudgetBurn
        expr: |
          (
            (slo:cart_availability:error_ratio_rate1d / on(slo) (1 - slo:cart_availability:objective)) > 3
            and
            (slo:cart_availability:error_ratio_rate2h / on(slo) (1 - slo:cart_availability:objective)) > 3
          )
          or
          (
            (slo:cart_availability:error_ratio_rate3d / on(slo) (1 - slo:cart_availability:objective)) > 1
            and

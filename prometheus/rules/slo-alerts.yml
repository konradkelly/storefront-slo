# Multi-window, multi-burn-rate alerts for the SLOs in docs/slo.md (Google SRE Workbook, "Alerting on SLOs").
# Built on the recording rules in slo.yml. kind gets k8s/base/slo-alerts.yaml via scripts/gen-k8s-rules.sh.
#
# Burn rate = error ratio / error budget. At 1x the budget lasts exactly the 28-day window, and at 14.4x it's
# gone in under 2 days. Each alert needs the long window AND the short window above the same burn rate:
#   - the long window proves the problem is big enough to matter (budget actually spent),
#   - the short window proves it's still happening, so the alert clears minutes after recovery
#     instead of staying red until the long window forgets the incident.
#
#   severity  long  short  burn  28d budget spent when it fires
#   page      1h    5m     14.4  2.1%
#   page      6h    30m    6     5.4%
#   ticket    1d    2h     3     10.7%
#   ticket    3d    6h     1     10.7%
#
# No `for:`. The short window already filters blips, and waiting longer only delays the page.
# The page and ticket for one SLO share an alertname (so one runbook) and differ by severity. Alertmanager
# inhibits the ticket while the page fires. {{ $value }} is the long-window burn rate.
groups:
  - name: slo-alerts
    rules:
      - alert: StorefrontCheckoutAvailabilityBudgetBurn
        expr: |
          (
            (slo:checkout_availability:error_ratio_rate1h / on(slo) (1 - slo:checkout_availability:objective)) > 14.4
            and
            (slo:checkout_availability:error_ratio_rate5m / on(slo) (1 - slo:checkout_availability:objective)) > 14.4
          )
          or
          (
            (slo:checkout_availability:error_ratio_rate6h / on(slo) (1 - slo:checkout_availability:objective)) > 6
            and
            (slo:checkout_availability:error_ratio_rate30m / on(slo) (1 - slo:checkout_availability:objective)) > 6
          )
        labels:
          severity: page
          slo: checkout-availability
        annotations:
          summary: "Checkout availability is burning its error budget fast"
          description: "Burning the 28-day error budget at {{ $value | printf \"%.1f\" }}x the sustainable rate."
          runbook_url: "https://github.com/konradkelly/storefront-slo/blob/main/docs/runbooks/StorefrontCheckoutAvailabilityBudgetBurn.md"
      - alert: StorefrontCheckoutAvailabilityBudgetBurn
        expr: |
          (
            (slo:checkout_availability:error_ratio_rate1d / on(slo) (1 - slo:checkout_availability:objective)) > 3
            and
            (slo:checkout_availability:error_ratio_rate2h / on(slo) (1 - slo:checkout_availability:objective)) > 3
          )
          or
          (
            (slo:checkout_availability:error_ratio_rate3d / on(slo) (1 - slo:checkout_availability:objective)) > 1
            and
            (slo:checkout_availability:error_ratio_rate6h / on(slo) (1 - slo:checkout_availability:objective)) > 1
          )
        labels:
          severity: ticket
          slo: checkout-availability
        annotations:
          summary: "Checkout availability is burning its error budget slowly"
          description: "Burning the 28-day error budget at {{ $value | printf \"%.1f\" }}x the sustainable rate."
          runbook_url: "https://github.com/konradkelly/storefront-slo/blob/main/docs/runbooks/StorefrontCheckoutAvailabilityBudgetBurn.md"
      - alert: StorefrontCheckoutLatencyBudgetBurn
        expr: |
          (
            (slo:checkout_latency:error_ratio_rate1h / on(slo) (1 - slo:checkout_latency:objective)) > 14.4
            and
            (slo:checkout_latency:error_ratio_rate5m / on(slo) (1 - slo:checkout_latency:objective)) > 14.4
          )
          or
          (
            (slo:checkout_latency:error_ratio_rate6h / on(slo) (1 - slo:checkout_latency:objective)) > 6
            and
            (slo:checkout_latency:error_ratio_rate30m / on(slo) (1 - slo:checkout_latency:objective)) > 6
          )
        labels:
          severity: page
          slo: checkout-latency
        annotations:
          summary: "Checkout latency is burning its error budget fast"
          description: "Burning the 28-day error budget at {{ $value | printf \"%.1f\" }}x the sustainable rate."
          runbook_url: "https://github.com/konradkelly/storefront-slo/blob/main/docs/runbooks/StorefrontCheckoutLatencyBudgetBurn.md"
      - alert: StorefrontCheckoutLatencyBudgetBurn
        expr: |
          (
            (slo:checkout_latency:error_ratio_rate1d / on(slo) (1 - slo:checkout_latency:objective)) > 3
            and
            (slo:checkout_latency:error_ratio_rate2h / on(slo) (1 - slo:checkout_latency:objective)) > 3
          )
          or
          (
            (slo:checkout_latency:error_ratio_rate3d / on(slo) (1 - slo:checkout_latency:objective)) > 1
            and
            (slo:checkout_latency:error_ratio_rate6h / on(slo) (1 - slo:checkout_latency:objective)) > 1
          )
        labels:
          severity: ticket
          slo: checkout-latency
        annotations:
          summary: "Checkout latency is burning its error budget slowly"
          description: "Burning the 28-day error budget at {{ $value | printf \"%.1f\" }}x the sustainable rate."
          runbook_url: "https://github.com/konradkelly/storefront-slo/blob/main/docs/runbooks/StorefrontCheckoutLatencyBudgetBurn.md"
      - alert: StorefrontCatalogAvailabilityBudgetBurn
        expr: |
          (
            (slo:catalog_availability:error_ratio_rate1h / on(slo) (1 - slo:catalog_availability:objective)) > 14.4
            and
            (slo:catalog_availability:error_ratio_rate5m / on(slo) (1 - slo:catalog_availability:objective)) > 14.4
          )
          or
          (
            (slo:catalog_availability:error_ratio_rate6h / on(slo) (1 - slo:catalog_availability:objective)) > 6
            and
            (slo:catalog_availability:error_ratio_rate30m / on(slo) (1 - slo:catalog_availability:objective)) > 6
          )
        labels:
          severity: page
          slo: catalog-availability
        annotations:
          summary: "Catalog availability is burning its error budget fast"
          description: "Burning the 28-day error budget at {{ $value | printf \"%.1f\" }}x the sustainable rate."
          runbook_url: "https://github.com/konradkelly/storefront-slo/blob/main/docs/runbooks/StorefrontCatalogAvailabilityBudgetBurn.md"
      - alert: StorefrontCatalogAvailabilityBudgetBurn
        expr: |
          (
            (slo:catalog_availability:error_ratio_rate1d / on(slo) (1 - slo:catalog_availability:objective)) > 3
            and
            (slo:catalog_availability:error_ratio_rate2h / on(slo) (1 - slo:catalog_availability:objective)) > 3
          )
          or
          (
            (slo:catalog_availability:error_ratio_rate3d / on(slo) (1 - slo:catalog_availability:objective)) > 1
            and
            (slo:catalog_availability:error_ratio_rate6h / on(slo) (1 - slo:catalog_availability:objective)) > 1
          )
        labels:
          severity: ticket
          slo: catalog-availability
        annotations:
          summary: "Catalog availability is burning its error budget slowly"
          description: "Burning the 28-day error budget at {{ $value | printf \"%.1f\" }}x the sustainable rate."
          runbook_url: "https://github.com/konradkelly/storefront-slo/blob/main/docs/runbooks/StorefrontCatalogAvailabilityBudgetBurn.md"
      - alert: StorefrontCartAvailabilityBudgetBurn
        expr: |
          (
            (slo:cart_availability:error_ratio_rate1h / on(slo) (1 - slo:cart_availability:objective)) > 14.4
            and
            (slo:cart_availability:error_ratio_rate5m / on(slo) (1 - slo:cart_availability:objective)) > 14.4
          )
          or
          (
            (slo:cart_availability:error_ratio_rate6h / on(slo) (1 - slo:cart_availability:objective)) > 6
            and
            (slo:cart_availability:error_ratio_rate30m / on(slo) (1 - slo:cart_availability:objective)) > 6
          )
        labels:
          severity: page
          slo: cart-availability
        annotations:
          summary: "Cart availability is burning its error budget fast"
          description: "Burning the 28-day error budget at {{ $value | printf \"%.1f\" }}x the sustainable rate."
          runbook_url: "https://github.com/konradkelly/storefront-slo/blob/main/docs/runbooks/StorefrontCartAvailabilityBudgetBurn.md"
      - alert: StorefrontCartAvailabilityBudgetBurn
        expr: |
          (
            (slo:cart_availability:error_ratio_rate1d / on(slo) (1 - slo:cart_availability:objective)) > 3
            and
            (slo:cart_availability:error_ratio_rate2h / on(slo) (1 - slo:cart_availability:objective)) > 3
          )
          or
          (
            (slo:cart_availability:error_ratio_rate3d / on(slo) (1 - slo:cart_availability:objective)) > 1
            and
            (slo:cart_availability:error_ratio_rate6h / on(slo) (1 - slo:cart_availability:objective)) > 1
          )
        labels:
          severity: ticket
          slo: cart-availability
        annotations:
          summary: "Cart availability is burning its error budget slowly"
          description: "Burning the 28-day error budget at {{ $value | printf \"%.1f\" }}x the sustainable rate."
          runbook_url: "https://github.com/konradkelly/storefront-slo/blob/main/docs/runbooks/StorefrontCartAvailabilityBudgetBurn.md"
      # A dead app records no requests, so every SLI above goes quiet instead of red. This covers that hole.
      - alert: StorefrontApiDown
        expr: sum(up{job="storefront-api"}) == 0 or absent(up{job="storefront-api"})
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "No storefront-api instance is being scraped successfully"
          description: "Prometheus can't scrape any storefront-api target. The SLO alerts can't see an outage like this."
          runbook_url: "https://github.com/konradkelly/storefront-slo/blob/main/docs/runbooks/StorefrontApiDown.md"
      # The SLIs above count the requests the app answers. When requests hang, or never reach the app, they record
      # little or nothing: 1% of the failures in the k3s control-plane stop (docs/postmortems/). This counts time
      # instead. blackbox-exporter fetches a product through the Gateway every 15 s (k8s/monitoring/storefront-probe.yaml),
      # whether or not anyone else is sending traffic. Pages when most probes in 3 minutes failed. Only kind and
      # k3s run the probe. In Compose there's no probe_success, and this never fires.
      - alert: StorefrontProbeFailing
        expr: avg_over_time(probe_success{job="storefront-probe"}[3m]) < 0.5
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Synthetic requests through the Gateway are failing"
          description: "{{ $value | humanizePercentage }} of probes succeeded in the last 3 minutes."
          runbook_url: "https://github.com/konradkelly/storefront-slo/blob/main/docs/runbooks/StorefrontProbeFailing.md"
      # Checkout is the last step of a shopping session. When the steps before it fail, nobody gets that far, the
      # checkout SLI has no attempts to divide by, and it stays quiet instead of red (k3s control-plane stop). This
      # fires when checkout attempts stop while shoppers still arrive:
      #   - no POST /orders in 5 minutes,
      #   - over 100 in the hour before, so 5 quiet minutes are a surprise (8 or more expected), not a quiet evening,
      #   - GET /products in the last 2 minutes: shoppers still start sessions. When all traffic stops (a load test
      #     ends, or nothing gets in at all) it stays quiet; StorefrontProbeFailing covers an empty front door. The
      #     probe fetches /products/{id}, so it doesn't count as a shopper.
      # "The hour before" stands in for "normal for this time of day". Production would compare with the same time
      # last week, which a lab rebuilt every day never has. Because of that, the alert clears after an hour without
      # checkouts, whether or not they're back.
      - alert: StorefrontCheckoutTrafficStopped
        expr: |
          (sum(increase(http_server_requests_seconds_count{application="storefront-api", uri="/orders", method="POST"}[5m])) or vector(0)) == 0
          and
          sum(increase(http_server_requests_seconds_count{application="storefront-api", uri="/orders", method="POST"}[1h] offset 5m)) > 100
          and
          sum(rate(http_server_requests_seconds_count{application="storefront-api", uri="/products", method="GET"}[2m])) > 0
        for: 2m
        labels:
          severity: page
          slo: checkout-availability
        annotations:
          summary: "Shoppers are arriving, but nobody has reached checkout for 5 minutes"
          description: "No POST /orders for 5 minutes, after more than 100 in the hour before. The checkout SLO can't see this: with no attempts, it has nothing to burn."
          runbook_url: "https://github.com/konradkelly/storefront-slo/blob/main/docs/runbooks/StorefrontCheckoutTrafficStopped.md"

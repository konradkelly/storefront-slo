          description: "Burning the 28-day error budget at {{ $value | printf \"%.1f\" }}x the sustainable rate."
          runbook_url: "https://github.com/konradkelly/storefront-slo/blob/main/docs/runbooks/StorefrontCheckoutLatencyBudgetBurn.md"
      - alert: StorefrontCatalogAvailabilityBudgetBurn
        expr: |
          (
            (slo:catalog_availability:error_ratio_rate1h / on(slo) (1 - slo:catalog_availability:objective)) > 14.4
            and
